name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal steps, with secrets and private paths removed.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python version, Bridge version/commit, executor version.
